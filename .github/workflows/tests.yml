name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Check the web app scripts
        run: |
          for f in src/domotiq/web/static/js/*.js src/domotiq/web/static/js/screens/*.js; do
            node --input-type=module --check < "$f"
          done
